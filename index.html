<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Small Tools</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="vendor/vue.global.prod.js"></script>
  <script defer src="js/translations.js"></script>
  <script defer src="js/version.js"></script>
  <script defer src="js/qr-reader.js"></script>
  <script defer src="js/pdf-viewer.js"></script>
  <script defer src="js/compass.js"></script>
  <script defer src="js/level.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/pwa.js"></script>
</head>
<body>
  <noscript>Pro spuštění aplikace povolte JavaScript. Enable JavaScript to run this application.</noscript>
  <div id="app" class="page-shell" v-cloak>
    <header class="site-header">
      <a class="brand" href="#/" :aria-label="t('brand.home')">
        <span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>small<span class="brand-light">tools</span><span class="brand-dot">.</span></span>
      </a>
      <span class="header-note">{{ t('header.note') }}</span>
    </header>

    <main id="main-content">
      <template v-if="page === 'menu'">
      <section class="intro" aria-labelledby="page-title">
        <span class="eyebrow"><span class="status-dot"></span> {{ t('menu.eyebrow') }}</span>
        <h1 id="page-title">{{ t('menu.title') }}<br /><span>{{ t('menu.subtitle') }}</span></h1>
        <p>{{ t('menu.intro') }}<br class="desktop-break" /> {{ t('menu.invitation') }}</p>
      </section>

      <section class="tool-section" aria-labelledby="tools-title">
        <div class="section-heading">
          <div class="section-title"><h2 id="tools-title">{{ t('tools.heading') }}</h2><span class="count">{{ tools.length }}</span></div>
          <div class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m16 16 4 4" /></svg>
            <label class="sr-only" for="tool-search">{{ t('search.label') }}</label>
            <input id="tool-search" v-model="query" type="search" :placeholder="t('search.placeholder')" autocomplete="off" />
          </div>
        </div>

        <div class="tool-grid">
          <article v-for="tool in filteredTools" :key="tool.id" class="tool-card" :class="tool.color" :aria-labelledby="`title-${tool.id}`">
            <div class="card-top">
              <span class="tool-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path v-for="(path, index) in icons[tool.icon]" :key="index" :d="path" /></svg></span>
              <span v-if="tool.href" class="available-tool">{{ t('tools.open') }} ↗</span>
              <span v-else class="coming-soon">{{ t('tools.comingSoon') }}</span>
            </div>
            <div class="card-copy">
              <span class="category">{{ tool.category }}</span>
              <h3 :id="`title-${tool.id}`"><a v-if="tool.href" class="tool-link" :href="tool.href">{{ tool.name }}</a><template v-else>{{ tool.name }}</template></h3>
              <p>{{ tool.description }}</p>
            </div>
          </article>
        </div>
        <div v-if="filteredTools.length === 0" class="empty-state" role="status">
          <h3>{{ t('search.emptyTitle') }}</h3>
          <p>{{ t('search.emptyDescription') }}</p>
          <button type="button" @click="query = ''">{{ t('search.reset') }}</button>
        </div>
        <p class="roadmap-note"><span aria-hidden="true">＋</span> {{ t('menu.roadmap') }}</p>
      </section>
      </template>
      <qr-reader v-else-if="page === 'qr'" :t="t"></qr-reader>
      <pdf-viewer v-else-if="page === 'pdf'" :t="t"></pdf-viewer>
      <compass-tool v-else-if="page === 'compass'" :t="t"></compass-tool>
      <level-tool v-else :t="t"></level-tool>
    </main>

    <footer class="site-footer"><span>SMT · {{ version }}</span></footer>
  </div>
  <template id="qr-reader-template">
    <section class="qr-page" aria-labelledby="qr-title">
      <a class="back-link" href="#/">← {{ t('qr.back') }}</a>
      <div class="qr-heading">
        <span class="eyebrow">{{ t('tool.qr.category') }}</span>
        <h1 id="qr-title">{{ t('tool.qr.name') }}</h1>
        <p>{{ t('qr.intro') }}</p>
      </div>
      <div v-if="capability !== 'ready'" class="qr-notice" role="status">{{ t('qr.capability.' + capability) }}</div>
      <div class="camera-panel" :class="{ 'camera-active': state === 'scanning' }">
        <video ref="video" class="camera-video" autoplay muted playsinline :aria-label="t('qr.preview')"></video>
        <div v-if="state !== 'scanning'" class="camera-placeholder"><span aria-hidden="true">▣</span><p>{{ t(state === 'starting' ? 'qr.starting' : 'qr.cameraIdle') }}</p></div>
        <div v-if="state === 'scanning'" class="scan-guide" aria-hidden="true"></div>
      </div>
      <div class="scanner-controls">
        <button v-if="state === 'readingPhoto'" type="button" class="secondary-button" @click="stopCamera">{{ t('qr.cancelPhoto') }}</button>
        <button v-else-if="state === 'starting' || state === 'scanning'" type="button" class="secondary-button" @click="stopCamera">{{ t('qr.stop') }}</button>
        <button v-else type="button" class="primary-button" :disabled="capability !== 'ready'" @click="startCamera">{{ t(result === null ? 'qr.start' : 'qr.again') }}</button>
        <button type="button" class="secondary-button photo-button" :disabled="!canReadPhoto || state === 'readingPhoto'" @click="photoInput.click()">{{ t('qr.choosePhoto') }}</button>
        <input ref="photoInput" type="file" accept="image/*" hidden @change="readPhoto">
      </div>
      <p v-if="state === 'readingPhoto'" class="scan-status" role="status">{{ t('qr.readingPhoto') }}</p>
      <p v-if="state === 'scanning'" class="scan-status" role="status">{{ t('qr.scanning') }}</p>
      <p v-if="errorKey" class="qr-error" role="alert">{{ t(errorKey) }}</p>
      <section v-if="result !== null" class="qr-result" aria-labelledby="qr-result-title" aria-live="polite">
        <h2 id="qr-result-title">{{ t('qr.result') }}</h2>
        <pre v-if="result.length" class="qr-result-data"><a v-if="resultUrl" :href="resultUrl" target="_blank" rel="noopener noreferrer" class="qr-result-link" :title="t('qr.openUrl')">{{ result }}</a><template v-else>{{ result }}</template></pre>
        <p v-else>{{ t('qr.emptyResult') }}</p>
      </section>
      <p class="qr-local-note">{{ t('qr.localNote') }}</p>
    </section>
  </template>
  <template id="pdf-viewer-template">
    <section class="pdf-page" aria-labelledby="pdf-title">
      <a class="back-link" href="#/">← {{ t('pdf.back') }}</a>
      <div class="qr-heading">
        <span class="eyebrow">{{ t('tool.pdf.category') }}</span>
        <h1 id="pdf-title">{{ t('tool.pdf.name') }}</h1>
        <p>{{ t('pdf.intro') }}</p>
      </div>
      <div class="scanner-controls">
        <button type="button" class="primary-button pdf-choose" @click="fileInput.click()">{{ t('pdf.choose') }}</button>
        <button v-if="fileUrl || loading" type="button" class="secondary-button pdf-clear" @click="clearDocument">{{ t('pdf.close') }}</button>
        <input ref="fileInput" type="file" accept="application/pdf,.pdf" hidden @change="selectFile">
      </div>
      <p v-if="loading" class="scan-status" role="status">{{ t('pdf.loading') }}</p>
      <p v-if="errorKey" class="qr-error" role="alert">{{ t(errorKey) }}</p>
      <div v-if="fileUrl" class="pdf-document">
        <div class="pdf-toolbar">
          <h2 class="pdf-name">{{ fileName }}</h2>
          <div class="pdf-actions">
            <a :href="fileUrl" target="_blank" rel="noopener noreferrer" class="pdf-open">{{ t('pdf.open') }} ↗</a>
            <a :href="fileUrl" :download="fileName" class="pdf-download">{{ t('pdf.download') }}</a>
          </div>
        </div>
        <iframe v-if="canEmbed" :key="fileUrl" :src="fileUrl" class="pdf-preview" :title="t('pdf.preview')"></iframe>
        <p class="pdf-fallback">{{ t(canEmbed ? 'pdf.fallback' : 'pdf.unsupported') }}</p>
      </div>
      <div v-else-if="!loading" class="pdf-empty"><span aria-hidden="true">▤</span><p>{{ t('pdf.empty') }}</p></div>
      <p class="qr-local-note">{{ t('pdf.localNote') }}</p>
    </section>
  </template>
  <template id="compass-template">
    <section class="compass-page" aria-labelledby="compass-title">
      <a class="back-link" href="#/">← {{ t('compass.back') }}</a>
      <div class="qr-heading">
        <span class="eyebrow">{{ t('tool.compass.category') }}</span>
        <h1 id="compass-title">{{ t('tool.compass.name') }}</h1>
        <p>{{ t('compass.intro') }}</p>
      </div>
      <div class="compass-dial" :class="{ 'compass-inactive': heading === null }" :style="{ '--heading': (heading ?? 0) + 'deg' }" aria-hidden="true">
        <div class="compass-marker"></div>
        <div class="compass-rose">
          <span class="compass-label compass-north">{{ t('compass.short.n') }}</span>
          <span class="compass-label compass-east">{{ t('compass.short.e') }}</span>
          <span class="compass-label compass-south">{{ t('compass.short.s') }}</span>
          <span class="compass-label compass-west">{{ t('compass.short.w') }}</span>
          <div class="compass-needle"></div>
          <div class="compass-pin"></div>
        </div>
      </div>
      <div class="compass-readout">
        <div class="compass-degrees" :aria-label="t('compass.heading')">{{ degrees === null ? '—' : degrees }}°</div>
        <p class="compass-direction">{{ direction ? t('compass.direction.' + direction) : t('compass.noHeading') }}</p>
      </div>
      <p class="compass-status" role="status">{{ t('compass.state.' + state) }}</p>
      <div class="scanner-controls compass-controls">
        <button v-if="running" type="button" class="secondary-button compass-stop" @click="stop">{{ t('compass.stop') }}</button>
        <button v-else type="button" class="primary-button compass-start" @click="start">{{ t('compass.start') }}</button>
        <button type="button" class="secondary-button compass-calibration-toggle" :aria-expanded="calibrationOpen" aria-controls="compass-calibration" @click="calibrationOpen = !calibrationOpen">{{ t('compass.calibrate') }}</button>
      </div>
      <div v-if="source" class="compass-diagnostics">
        <p>{{ t('compass.source') }}: <span class="compass-source">{{ t('compass.source.' + source) }}</span></p>
        <p>{{ t('compass.accuracy') }}: <span class="compass-accuracy">{{ accuracy !== null && accuracy >= 0 ? '±' + Math.round(accuracy) + '°' : t('compass.accuracyUnknown') }}</span></p>
        <p v-if="correction !== null" class="compass-correction">{{ t('compass.correctionActive') }}</p>
      </div>
      <section v-if="calibrationOpen" id="compass-calibration" class="compass-calibration" aria-labelledby="compass-calibration-title">
        <h2 id="compass-calibration-title">{{ t('compass.calibrationTitle') }}</h2>
        <ol><li>{{ t('compass.calibrationStep1') }}</li><li>{{ t('compass.calibrationStep2') }}</li><li>{{ t('compass.calibrationStep3') }}</li></ol>
        <button type="button" class="secondary-button compass-restart" @click="restart">{{ t('compass.restart') }}</button>
        <h3>{{ t('compass.manualTitle') }}</h3>
        <p>{{ t('compass.manualHint') }}</p>
        <div class="scanner-controls">
          <button type="button" class="secondary-button compass-align" :disabled="heading === null || state !== 'active'" @click="alignNorth">{{ t('compass.align') }}</button>
          <button v-if="correction !== null" type="button" class="secondary-button compass-reset-correction" @click="resetCorrection">{{ t('compass.resetCorrection') }}</button>
        </div>
      </section>
      <p class="qr-local-note">{{ t('compass.hint') }}</p>
    </section>
  </template>
  <template id="level-template">
    <section class="level-page" aria-labelledby="level-title">
      <a class="back-link" href="#/">← {{ t('level.back') }}</a>
      <div class="qr-heading">
        <span class="eyebrow">{{ t('tool.level.category') }}</span>
        <h1 id="level-title">{{ t('tool.level.name') }}</h1>
        <p>{{ t(mode === 'edge' ? 'level.edgeIntro' : 'level.intro') }}</p>
      </div>
      <div class="level-mode-controls" role="group" :aria-label="t('level.mode')">
        <button type="button" class="secondary-button level-mode-flat" :aria-pressed="mode === 'flat'" @click="setMode('flat')">{{ t('level.modeFlat') }}</button>
        <button type="button" class="secondary-button level-mode-edge" :aria-pressed="mode === 'edge'" @click="setMode('edge')">{{ t('level.modeEdge') }}</button>
      </div>
      <div class="level-surface" :class="{ 'level-balanced': isLevel, 'level-inactive': !tilt, 'level-edge': mode === 'edge', 'level-edge-horizontal': mode === 'edge' && edgeHorizontal }" aria-hidden="true">
        <div class="level-crosshair"></div>
        <div class="level-target"></div>
        <div class="level-bubble" :style="bubbleStyle"></div>
      </div>
      <div v-if="mode === 'flat'" class="level-readings">
        <div><span>{{ t('level.axisX') }}</span><strong class="level-x">{{ formatAngle(tilt?.x) }}°</strong></div>
        <div><span>{{ t('level.axisY') }}</span><strong class="level-y">{{ formatAngle(tilt?.y) }}°</strong></div>
      </div>
      <div v-else class="level-readings level-single"><div><span>{{ t('level.edgeAxis') }}</span><strong class="level-edge-angle">{{ formatAngle(tilt?.y) }}°</strong></div></div>
      <p class="level-status" role="status">{{ t(state === 'active' ? (mode === 'edge' ? (isLevel ? 'level.edgeBalanced' : 'level.edgeTilted') : (isLevel ? 'level.balanced' : 'level.tilted')) : 'level.state.' + state) }}</p>
      <div class="scanner-controls level-controls">
        <button v-if="running" type="button" class="secondary-button level-stop" @click="stop">{{ t('level.stop') }}</button>
        <button v-else type="button" class="primary-button level-start" @click="start">{{ t('level.start') }}</button>
        <button type="button" class="secondary-button level-calibrate" :disabled="!tilt" @click="calibrate">{{ t('level.calibrate') }}</button>
        <button v-if="reference" type="button" class="secondary-button level-reset" @click="resetCalibration">{{ t('level.reset') }}</button>
      </div>
      <p v-if="reference" class="level-calibrated">{{ t('level.calibrated') }}</p>
      <p class="qr-local-note">{{ t('level.hint') }}</p>
    </section>
  </template>
</body>
</html>
